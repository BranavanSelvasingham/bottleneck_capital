[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bottleneck-capital"
version = "0.1.0"
description = "Long-term thesis decision engine with fast dip detection."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[project.scripts]
bcap = "bottleneck_capital.cli:main"

[tool.setuptools.packages.find]
include = ["bottleneck_capital*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
