runtime_policy:
  model: best_available
  preferred_model: GPT-5.5_or_newer_when_selectable
  reasoning_effort: extra_high
  spawned_threads: same_policy
  subagents: same_policy
  fallback: If explicit model or effort selection is unavailable, record that limitation and use the strongest available equivalent.
event_routes:
  dip_trigger:
    - asset_analyst.{ticker}
    - sleeve_analyst.{sleeve}
  thesis_damage_candidate:
    - asset_analyst.{ticker}
    - sleeve_analyst.{sleeve}
    - portfolio_pm
  sa_exit_update:
    - asset_analyst.{ticker}
    - sleeve_analyst.{sleeve}
    - portfolio_pm
  sa_position_reduction_update:
    - asset_analyst.{ticker}
    - sleeve_analyst.{sleeve}
  filing_update:
    - filing_analyst
    - asset_analyst.{ticker}
  hedge_risk_update:
    - hedge_analyst
    - portfolio_pm
  catalyst_update:
    - asset_analyst.{ticker}
limits:
  max_concurrent_asset_agents: 6
  max_concurrent_write_agents: 3
  default_task_timeout_minutes: 45
write_discipline:
  sole_decision_writer: portfolio_pm
  collector_write_scope:
    - state/latest_events.jsonl
    - state/latest_market_events.jsonl
    - state/latest_filings_events.jsonl
    - state/signal_events.jsonl
    - state/ingest_status.json
  macro_watcher_write_scope:
    - state/latest_manual_events.jsonl
    - state/latest_events.jsonl
    - state/signal_events.jsonl
  research_resolver_write_scope:
    - research/memos/{date}-{ticker}-*.md
    - state/research_handoffs.jsonl
  asset_agent_write_scope:
    - research/memos/{date}-{ticker}-*.md
  portfolio_pm_write_scope:
    - research/assets/{ticker}.md
    - research/decisions/{ticker}.md
    - research/decisions/index.md
    - state/research_handoffs.jsonl
    - reports/daily_decision_boards/{date}.md
    - reports/local_portfolio_boards/{date}.md
